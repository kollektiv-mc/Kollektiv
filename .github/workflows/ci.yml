# This repo's own checks. The cross-repo drift checks, which clone the products
# and run nightly, are .github/workflows/drift.yml: a red nightly there is a
# product having moved, and it should not read as this repo's push being red.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install check-jsonschema

      - name: Script syntax
        run: for f in scripts/*.sh scripts/lib/*.sh; do bash -n "$f" || exit 1; done

      # Also covers the suite-kit version pair and the runner's syntax, which
      # used to be checked only by .claude/suite.json and sync-runner.sh
      # respectively. One implementation, both gates.
      - name: Manifests
        run: ./scripts/check-manifests.sh

      - name: Schema validation
        run: ./scripts/validate-schemas.sh

      # The classifier every product's release notes are built by. Pure and
      # offline, and this is the master copy — a product only ever runs the
      # vendored one.
      - name: Release-notes classifier
        run: python3 plugins/suite-kit/release-notes_test.py

  # The AI-slop gate this repo asks the products to carry, applied to itself:
  # the master copies of the runner and the generator are scored here, so a
  # finding against a vendored file is always a finding against this repo.
  # The same steps as plugins/suite-kit/workflows/aislop.yml, the copy the
  # products vendor; this repo is not a product, so it carries them inline.
  # ruff is installed explicitly because aislop's Python engines run only when
  # a ruff binary is on PATH, and report nothing at all when one is not.
  aislop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install ruff==0.16.7

      - run: npx --yes aislop@0.16.0 ci
