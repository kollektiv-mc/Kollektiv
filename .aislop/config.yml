# This repo's aislop config. The policy is base.yml, which is the master copy
# the products vendor; only this repo's own numbers live here. Run locally with
# `npx --yes aislop@0.16.0 scan`; CI runs `aislop ci` through
# .github/workflows/aislop.yml, which pins both aislop and ruff.
#
# The `./` is load-bearing: aislop resolves `extends` relative to this file, and
# `base.yml` without it silently loads nothing.
extends: ./base.yml

quality:
  # A ratchet held at today's largest file, lowered as it shrinks, never raised.
  # maxFileLoc 612: held by plugins/suite-kit/suite-check.py (612 lines).
  maxFileLoc: 612
  # Over the suite's 5, held by run_invariants in the same file (depth 7). #23
  # already touches that function; take this line back to the base when it is
  # split.
  maxNesting: 7
