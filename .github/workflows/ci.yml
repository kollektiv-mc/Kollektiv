# This repo's own checks. The cross-repo drift checks, which clone the products
# and run nightly, are .github/workflows/drift.yml: a red nightly there is a
# product having moved, and it should not read as this repo's push being red.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - run: pip install check-jsonschema

      - name: Script syntax
        run: for f in scripts/*.sh scripts/lib/*.sh; do bash -n "$f" || exit 1; done

      # Also covers the suite-kit version pair.
      - name: Manifests
        run: ./scripts/check-manifests.sh

      - name: Schema validation
        run: ./scripts/validate-schemas.sh

      # docs/conventions.md § Public copy. The website is the only published
      # surface that lives in a file; issue and pull request titles and commit
      # messages are not gated anywhere, which that section says outright.
      - name: Published copy
        run: ./scripts/check-copy.sh

      # The home page is styled from design/tokens.json through a generator
      # whose output is committed, the same shape as a product's gen:tokens.
      # A token change that forgot the site, or a hand edit to tokens.css,
      # shows up here as a diff. No product is needed for it, so it belongs
      # with this repo's own checks rather than in drift.yml.
      - name: Website tokens
        run: ./website/gen-tokens.py && git diff --exit-code -- website/tokens.css
